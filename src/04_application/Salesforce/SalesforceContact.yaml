id: https://example.org/edm/application/Salesforce/SalesforceContact
name: application_salesforce_contact
title: Application (Salesforce) — SalesforceContact
description: >
  Salesforce projection of a CustomerContactRole. Maps Salesforce's
  Contact object onto the canonical CustomerContactRole.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../02_domain/Sales/CustomerContactRole
  - ../_shared/SyncMetadata

classes:
  SalesforceContact:
    is_a: CustomerContactRole
    description: Salesforce Contact projection of CustomerContactRole.
    attributes:
      sf_contact_id:
        range: string
        required: true
        description: 18-character Salesforce Contact ID.
      sf_record_url:
        range: uri
      sf_email_opt_out:
        range: boolean
      sf_do_not_call:
        range: boolean
      sf_lead_source:
        range: string
      sf_owner_user_id:
        range: string
      sync:
        range: SyncMetadata
        required: true
