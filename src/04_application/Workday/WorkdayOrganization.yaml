id: https://example.org/edm/application/Workday/WorkdayOrganization
name: application_workday_organization
title: Application (Workday) — WorkdayOrganization
description: >
  Workday's projection of Organization. Workday's "Supervisory
  Organization" is the primary org concept; this projection maps it
  to the canonical Organization (typically OrganizationalUnit).

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Organization
  - ../_shared/SyncMetadata

classes:
  WorkdayOrganization:
    is_a: OrganizationalUnit
    description: Workday Supervisory Organization projection.
    attributes:
      workday_org_id:
        range: string
        required: true
      workday_org_type:
        range: string
        description: Workday's native org type (Supervisory, Cost Center, Region, ...).
      workday_manager_worker_id:
        range: string
        description: Workday Worker ID of the organization's manager.
      sync:
        range: SyncMetadata
        required: true
