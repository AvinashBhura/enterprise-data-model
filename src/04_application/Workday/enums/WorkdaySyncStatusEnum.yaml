id: https://example.org/edm/application/Workday/enums/WorkdaySyncStatusEnum
name: application_workday_sync_status_enum
title: Application (Workday) — WorkdaySyncStatusEnum
description: >
  Workday-specific extension of SyncStatusEnum capturing additional
  Workday-side states that don't fit the generic SyncStatusEnum
  vocabulary (e.g., Workday transaction-pending states).

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types

enums:
  WorkdaySyncStatusEnum:
    description: Workday-specific sync states.
    permissible_values:
      PENDING:
      IN_PROGRESS:
      SYNCED:
      OUT_OF_SYNC:
      WORKDAY_TRANSACTION_PENDING:
        description: Workday business process not yet completed.
      WORKDAY_INTEGRATION_FAILED:
      RETIRED:
