id: https://example.org/edm/foundation/common/codelists/types/AddressTypeEnum
name: common_codelist_address_type_enum
title: Common — AddressTypeEnum
description: Purpose classifier for Address instances.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types

enums:

  AddressTypeEnum:
    description: Purpose for which an Address is used.
    permissible_values:
      HOME:
        description: A person's home residence.
      BUSINESS:
        description: A business location.
      BILLING:
        description: Address for invoicing/billing.
      SHIPPING:
        description: Address for shipment delivery.
      REMIT_TO:
        description: Address for remitting payments.
      REGISTERED:
        description: Legally registered address of an entity.
      MAILING:
        description: Mailing / correspondence address.
      EMERGENCY:
        description: Emergency-contact address.
      SERVICE:
        description: Address at which service is delivered.
