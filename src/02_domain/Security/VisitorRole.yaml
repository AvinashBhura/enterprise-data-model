id: https://example.org/edm/domain/Security/VisitorRole
name: domain_security_visitor_role
title: Domain (Security) — VisitorRole
description: A Person granted time-bound access to a facility.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Role
  - ../../01_foundation/Person
  - ../../01_foundation/Organization
  - ../../01_foundation/common/codelists/types/RoleTypeEnum
  - enums/VisitLifecycleStateEnum

classes:
  VisitorRole:
    is_a: Role
    description: A Person's time-bound facility access.
    slot_usage:
      role_type:
        equals_string: VISITOR
      held_by_person:
        required: true
      lifecycle_state:
        range: VisitLifecycleStateEnum
        required: true
    attributes:
      visitor_pass_id:
        range: string
        description: Pass / badge identifier for this visit.
      visiting_organization:
        range: Organization
        required: true
        description: Our LegalEntity / facility being visited.
      host_employee_role:
        range: string
        required: true
        description: entity_id of the EmployeeRole hosting the visit.
      visit_date:
        range: date
        required: true
      check_in_at:
        range: datetime
      check_out_at:
        range: datetime
      visit_purpose:
        range: string
        required: true
      visited_areas:
        range: string
        multivalued: true
        description: Specific facility areas the visitor accessed.
      escort_required:
        range: boolean
      nda_signed:
        range: string
        description: entity_id of NDA signed for this visit, if applicable.
