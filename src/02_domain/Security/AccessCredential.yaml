id: https://example.org/edm/domain/Security/AccessCredential
name: domain_security_access_credential
title: Domain (Security) — AccessCredential
description: A physical or virtual credential — badge, smart card, security token.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Asset
  - ../../01_foundation/Person
  - ../../01_foundation/common/codelists/types/AssetTypeEnum
  - enums/CredentialLifecycleStateEnum

classes:
  AccessCredential:
    is_a: Asset
    description: A physical or virtual access credential.
    slot_usage:
      asset_type:
        equals_string: PHYSICAL
      lifecycle_state:
        range: CredentialLifecycleStateEnum
        required: true
    attributes:
      credential_type:
        range: string
        required: true
        description: BADGE, SMART_CARD, TOKEN, KEY_CARD, MOBILE_CREDENTIAL.
      credential_number:
        range: string
        required: true
        description: Credential identifier printed/encoded on the credential.
      issued_to_person:
        range: Person
        required: true
      issued_for_role:
        range: string
        description: entity_id of the Role this credential is issued for.
      issued_at:
        range: datetime
      expires_at:
        range: datetime
      access_levels:
        range: string
        multivalued: true
        description: Access levels this credential grants.
      pin_required:
        range: boolean
      biometric_enrolled:
        range: boolean
