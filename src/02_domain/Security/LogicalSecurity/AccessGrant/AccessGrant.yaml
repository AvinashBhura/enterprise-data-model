id: https://example.org/edm/domain/Security/AccessGrant
name: domain_security_access_grant
title: Domain (Security) — AccessGrant
description: A permission record — who can access what, when, and why.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../../../01_foundation/Entity
  - ../../../../01_foundation/common/base/Identifiable
  - ../../../../01_foundation/common/base/Lifecycleable
  - ../../../../01_foundation/common/base/Temporal
  - enums/AccessGrantLifecycleStateEnum

classes:
  AccessGrant:
    is_a: Agreement
    mixins:
      - Identifiable
      - Lifecycleable
      - Temporal
    description: A permission to access a specific resource.
    slot_usage:
      lifecycle_state:
        range: AccessGrantLifecycleStateEnum
        required: true
    attributes:
      granted_to_role:
        range: string
        required: true
        description: entity_id of the Role this grant is given to.
      resource_type:
        range: string
        required: true
        description: Type of resource (APPLICATION, SYSTEM, FACILITY, DATA_SET, REPORT).
      resource_identifier:
        range: string
        required: true
        description: Identifier of the specific resource.
      access_level:
        range: string
        required: true
        description: Level of access (READ, WRITE, ADMIN, ...).
      justification:
        range: string
        description: Business justification for the grant.
      approver_role:
        range: string
        description: entity_id of the EmployeeRole approving the grant.
      approved_at:
        range: datetime
      provisioned_at:
        range: datetime
      expires_at:
        range: datetime
      last_recertified_at:
        range: datetime
        description: When access was last recertified (for periodic reviews).
