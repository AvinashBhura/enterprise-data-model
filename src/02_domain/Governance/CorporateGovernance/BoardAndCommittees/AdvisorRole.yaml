id: https://example.org/edm/domain/Governance/AdvisorRole
name: domain_governance_advisor_role
title: Domain (Governance) — AdvisorRole
description: >
  A Person engaged as a formal advisor — board advisor, technical
  advisor, strategic advisor. Distinct from ContractorRole (HR)
  because advisors typically have governance/strategic standing
  rather than executing project work.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../../../01_foundation/Role
  - ../../../../01_foundation/Person
  - ../../../../01_foundation/Organization
  - ../../../../01_foundation/common/codelists/types/RoleTypeEnum
  - ../../../../01_foundation/common/base/AmountType
  - enums/GovernanceRoleLifecycleStateEnum

classes:
  AdvisorRole:
    is_a: Role
    description: A Person formally engaged as an advisor.
    slot_usage:
      role_type:
        equals_string: ADVISOR
      held_by_person:
        required: true
      lifecycle_state:
        range: GovernanceRoleLifecycleStateEnum
        required: true
    attributes:
      advisory_focus:
        range: string
        description: TECHNICAL, STRATEGIC, FINANCIAL, REGULATORY, MARKET, OPERATIONAL.
      engaging_organization:
        range: Organization
        required: true
      annual_compensation:
        range: AmountType
      equity_grant_value:
        range: AmountType
      time_commitment_per_month:
        range: string
        description: Expected time commitment (e.g., "4 hours/month", "1 day/quarter").
      expertise_summary:
        range: string
