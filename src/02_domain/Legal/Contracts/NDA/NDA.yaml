id: https://example.org/edm/domain/Legal/NDA
name: domain_legal_nda
title: Domain (Legal) — NDA
description: A non-disclosure agreement.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../../../01_foundation/Agreement
  - ../../../../01_foundation/common/codelists/types/AgreementTypeEnum
  - enums/NDALifecycleStateEnum

classes:
  NDA:
    is_a: Agreement
    description: A non-disclosure agreement.
    slot_usage:
      agreement_type:
        equals_string: NDA
      lifecycle_state:
        range: NDALifecycleStateEnum
        required: true
    attributes:
      direction:
        range: string
        required: true
        description: ONE_WAY_DISCLOSING, ONE_WAY_RECEIVING, MUTUAL.
      purpose:
        range: string
        required: true
        description: Purpose of the disclosure relationship.
      term_months:
        range: integer
        description: NDA term in months.
      survival_months:
        range: integer
        description: Confidentiality survival period after termination, in months.
      governing_law:
        range: string
      jurisdiction:
        range: string
