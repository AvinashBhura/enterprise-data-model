  - linkml:types

enums:
  SalesAccountLifecycleStateEnum:
    description: Lifecycle states for a Sales Account.
    permissible_values:
      LEAD:
        description: Identified but not yet qualified.
      QUALIFIED:
        description: Qualified prospect.
      PROSPECT:
        description: Active sales pursuit underway.
      CUSTOMER:
        description: Active paying customer.
      INACTIVE:
        description: No active engagement.
      CHURNED:
        description: Lost as a customer.
      ARCHIVED:
        description: Archived per retention policy.
