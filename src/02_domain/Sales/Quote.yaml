id: https://example.org/edm/domain/Sales/Quote
name: domain_sales_quote
title: Domain (Sales) — Quote
description: A pre-order pricing proposal.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Agreement
  - ../../01_foundation/common/codelists/types/AgreementTypeEnum
  - ../../01_foundation/common/base/AmountType
  - Account
  - Opportunity
  - enums/QuoteLifecycleStateEnum

classes:
  QuoteLine:
    description: A single line on a quote.
    attributes:
      line_number:
        range: integer
        required: true
      product_code:
        range: string
        required: true
      description:
        range: string
      quantity:
        range: decimal
      list_price:
        range: AmountType
      discount_percent:
        range: decimal
      unit_price:
        range: AmountType
      line_total:
        range: AmountType

  Quote:
    is_a: Agreement
    description: A pricing proposal preceding an order.
    slot_usage:
      agreement_type:
        equals_string: QUOTE
      lifecycle_state:
        range: QuoteLifecycleStateEnum
        required: true
    attributes:
      quote_number:
        range: string
        required: true
      account:
        range: Account
        required: true
      opportunity:
        range: Opportunity
      lines:
        range: QuoteLine
        multivalued: true
        required: true
      subtotal:
        range: AmountType
      discount_total:
        range: AmountType
      tax_total:
        range: AmountType
      grand_total:
        range: AmountType
        required: true
      valid_until:
        range: date
        description: Quote expiration date.
