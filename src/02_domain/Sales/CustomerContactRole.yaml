id: https://example.org/edm/domain/Sales/CustomerContactRole
name: domain_sales_customer_contact_role
title: Domain (Sales) — CustomerContactRole
description: >
  A Person acting as a contact at a customer Organization. The same
  Person may hold a CustomerContactRole at one or more customer
  accounts simultaneously, and may concurrently hold an EmployeeRole
  at her own employer.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Role
  - ../../01_foundation/Person
  - ../../01_foundation/Organization
  - ../../01_foundation/common/codelists/types/RoleTypeEnum
  - Account

classes:
  CustomerContactRole:
    is_a: Role
    description: A Person acting as contact at a customer Organization.
    slot_usage:
      role_type:
        equals_string: CUSTOMER_CONTACT
      held_by_person:
        required: true
    attributes:
      customer_account:
        range: Account
        required: true
        description: The Sales Account this contact is at.
      contact_title:
        range: string
        description: Title at the customer organization.
      department:
        range: string
        description: Department at the customer organization.
      contact_type:
        range: string
        description: PRIMARY, ECONOMIC_BUYER, TECHNICAL_BUYER, INFLUENCER, USER, GATEKEEPER.
      work_email:
        range: string
        pattern: "^[\\w.\\-+]+@[\\w.\\-]+\\.\\w+$"
      work_phone:
        range: string
      do_not_contact:
        range: boolean
      preferred_contact_method:
        range: string
        description: EMAIL, PHONE, IN_PERSON.
