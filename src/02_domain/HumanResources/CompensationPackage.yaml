id: https://example.org/edm/domain/HumanResources/CompensationPackage
name: domain_hr_compensation_package
title: Domain (HR) — CompensationPackage
description: >
  Salary, bonus, benefits, and equity structure for an EmployeeRole.
  Compensation changes create new instances rather than mutating
  existing ones — preserving full compensation history.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Entity
  - ../../01_foundation/common/base/Identifiable
  - ../../01_foundation/common/base/Lifecycleable
  - ../../01_foundation/common/base/Temporal
  - ../../01_foundation/common/base/AmountType

classes:
  CompensationPackage:
    is_a: Entity
    mixins:
      - Identifiable
      - Lifecycleable
      - Temporal
    description: Total compensation structure at a point in time.
    attributes:
      base_salary_annual:
        range: AmountType
      pay_frequency:
        range: string
        description: BIWEEKLY, MONTHLY, ANNUAL.
      target_bonus_percent:
        range: decimal
      target_bonus_amount:
        range: AmountType
      equity_grant_value:
        range: AmountType
      equity_grant_units:
        range: integer
      equity_vesting_schedule:
        range: string
      benefits_tier:
        range: string
      effective_from:
        range: date
        required: true
      effective_to:
        range: date
      reason:
        range: string
        description: NEW_HIRE, ANNUAL_REVIEW, PROMOTION, MARKET_ADJUSTMENT, RETENTION.
