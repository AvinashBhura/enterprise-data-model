id: https://example.org/edm/domain/HumanResources/EmploymentContract
name: domain_hr_employment_contract
title: Domain (HR) — EmploymentContract
description: A formal employment agreement between a Person and a LegalEntity.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Agreement
  - ../../01_foundation/common/codelists/types/AgreementTypeEnum
  - ../../01_foundation/common/codelists/types/EmploymentTypeEnum

classes:
  EmploymentContract:
    is_a: Agreement
    description: A formal employment agreement.
    slot_usage:
      agreement_type:
        equals_string: EMPLOYMENT_CONTRACT
    attributes:
      employment_type:
        range: EmploymentTypeEnum
        required: true
      probationary_period_months:
        range: integer
      notice_period_days:
        range: integer
      non_compete_clause:
        range: boolean
      non_compete_duration_months:
        range: integer
      ip_assignment_clause:
        range: boolean
      confidentiality_clause:
        range: boolean
      working_hours_per_week:
        range: decimal
      paid_time_off_days:
        range: integer
