id: https://example.org/edm/domain/Finance/enums/PaymentLifecycleStateEnum
name: domain_finance_payment_lifecycle_state_enum
title: Domain (Finance) — PaymentLifecycleStateEnum
description: Lifecycle states for a Payment.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types

enums:
  PaymentLifecycleStateEnum:
    description: Lifecycle states for a Payment.
    permissible_values:
      INITIATED:
        description: Payment instruction created.
      PENDING:
        description: Awaiting clearing.
      CLEARED:
        description: Cleared by the bank.
      SETTLED:
        description: Fully settled.
      FAILED:
        description: Payment failed.
      REVERSED:
        description: Payment was reversed.
      CANCELLED:
        description: Cancelled before clearing.
