id: https://example.org/edm/domain/Finance/FiscalPeriod
name: domain_finance_fiscal_period
title: Domain (Finance) — FiscalPeriod
description: >
  An accounting period — fiscal year, quarter, or month. Used as a
  reference by JournalEntry, Invoice, Budget, and other transactional
  records.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../../../01_foundation/Entity
  - ../../../../01_foundation/Organization
  - ../../../../01_foundation/common/base/Identifiable
  - ../../../../01_foundation/common/base/Lifecycleable

classes:
  FiscalPeriod:
    is_a: Period
    mixins:
      - Identifiable
      - Lifecycleable
    description: An accounting period.
    attributes:
      period_code:
        range: string
        required: true
        description: Period identifier (e.g., "FY2026", "FY2026-Q3", "FY2026-09").
      period_type:
        range: string
        required: true
        description: YEAR, QUARTER, MONTH, WEEK, DAY.
      legal_entity:
        range: Organization
        required: true
        description: LegalEntity this period applies to.
      start_date:
        range: date
        required: true
      end_date:
        range: date
        required: true
      parent_period:
        range: FiscalPeriod
        description: Containing period (e.g., a quarter contains months).
      is_open:
        range: boolean
        description: Whether postings are still allowed.
      closed_at:
        range: datetime
        description: When the period was closed.
