id: https://example.org/edm/domain/Procurement/PurchaseRequisition
name: domain_procurement_purchase_requisition
title: Domain (Procurement) — PurchaseRequisition
description: >
  A pre-PO request for goods or services. Approval workflow lives in
  03_process/PurchaseApproval/.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Entity
  - ../../01_foundation/common/base/Identifiable
  - ../../01_foundation/common/base/Lifecycleable
  - ../../01_foundation/common/base/AmountType
  - enums/RequisitionLifecycleStateEnum

classes:
  RequisitionLine:
    description: A single line on a PurchaseRequisition.
    attributes:
      line_number:
        range: integer
        required: true
      item_description:
        range: string
        required: true
      quantity:
        range: decimal
      estimated_unit_price:
        range: AmountType
      estimated_line_total:
        range: AmountType
      justification:
        range: string

  PurchaseRequisition:
    is_a: Entity
    mixins:
      - Identifiable
      - Lifecycleable
    description: A pre-PO request for goods or services.
    slot_usage:
      lifecycle_state:
        range: RequisitionLifecycleStateEnum
        required: true
    attributes:
      requisition_number:
        range: string
        required: true
      requester_role:
        range: string
        description: entity_id of the EmployeeRole submitting the requisition.
      requesting_organization:
        range: string
        description: OrganizationalUnit on whose behalf the request is made.
      lines:
        range: RequisitionLine
        multivalued: true
        required: true
      total_estimated_amount:
        range: AmountType
      needed_by_date:
        range: date
      business_justification:
        range: string
        description: Reason for the requested purchase.
      preferred_vendor_role:
        range: string
        description: entity_id of preferred VendorRole, if any.
      resulting_purchase_order:
        range: string
        description: entity_id of resulting PurchaseOrder.
