default_range: string

imports:
  - linkml:types

enums:
  VendorContractLifecycleStateEnum:
    description: Lifecycle states for a VendorContract.
    permissible_values:
      DRAFT:
        description: Being drafted.
      IN_NEGOTIATION:
        description: Under negotiation with vendor.
      LEGAL_REVIEW:
        description: Under legal review.
      APPROVED:
        description: Approved internally; awaiting signature.
      SIGNED:
        description: Signed by all parties.
      ACTIVE:
        description: In effect.
      AMENDED:
        description: Amended; superseded.
      EXPIRED:
        description: Reached end of term.
      TERMINATED:
        description: Terminated early.
      ARCHIVED:
        description: Archived per retention policy.
