id: https://example.org/edm/domain/Facilities/Lease
name: domain_facilities_lease
title: Domain (Facilities) — Lease
description: A real-estate or equipment lease agreement.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../01_foundation/Agreement
  - ../../01_foundation/common/codelists/types/AgreementTypeEnum
  - ../../01_foundation/common/base/AmountType
  - ../../01_foundation/common/base/QuantityType
  - Building
  - enums/LeaseLifecycleStateEnum

classes:
  Lease:
    is_a: Agreement
    description: A lease agreement covering real estate or equipment.
    slot_usage:
      agreement_type:
        equals_string: LEASE
      lifecycle_state:
        range: LeaseLifecycleStateEnum
        required: true
    attributes:
      lease_type:
        range: string
        required: true
        description: REAL_ESTATE, EQUIPMENT, VEHICLE.
      leased_subject_building:
        range: Building
        description: For real-estate leases — the building being leased.
      leased_area:
        range: QuantityType
        description: Area being leased (real-estate leases).
      base_rent_monthly:
        range: AmountType
      base_rent_annual:
        range: AmountType
      operating_expenses_included:
        range: boolean
      escalation_terms:
        range: string
        description: Annual rent escalation terms (e.g., "3% per year", "CPI-indexed").
      security_deposit:
        range: AmountType
      renewal_option:
        range: boolean
      renewal_notice_days:
        range: integer
      early_termination_fee:
        range: AmountType
