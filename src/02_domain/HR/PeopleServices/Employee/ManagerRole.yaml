id: https://example.org/edm/domain/HumanResources/ManagerRole
name: domain_hr_manager_role
title: Domain (HR) — ManagerRole
description: >
  A Role representing management authority over other Roles or
  Organizational Units. May overlap concurrently with EmployeeRole on
  the same Person.

license: Apache-2.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  edm: https://example.org/edm/

default_prefix: edm
default_range: string

imports:
  - linkml:types
  - ../../../../01_foundation/Role
  - ../../../../01_foundation/Person
  - ../../../../01_foundation/Organization
  - ../../../../01_foundation/common/codelists/types/RoleTypeEnum

classes:
  ManagerRole:
    is_a: Role
    description: Management authority over other Roles or units.
    slot_usage:
      role_type:
        equals_string: MANAGER
      held_by_person:
        required: true
    attributes:
      managed_organization:
        range: Organization
      management_scope:
        range: string
        description: e.g., "people manager", "functional manager".
      direct_report_count:
        range: integer
      total_reportee_count:
        range: integer
      approval_authority_level:
        range: string
      effective_from_management:
        range: date
